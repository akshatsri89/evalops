name: Run AI evaluation suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug - check secrets are reaching this job
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os
          k1 = os.environ.get('OPENAI_API_KEY', '')
          k2 = os.environ.get('GEMINI_API_KEY', '')
          print('OPENAI_API_KEY length:', len(k1))
          print('GEMINI_API_KEY length:', len(k2))
          print('OPENAI_API_KEY starts with gsk_:', k1.startswith('gsk_'))
          "

      - name: Run evaluation suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_MODEL: llama-3.1-8b-instant
          JUDGE_MODEL: gemini-3.5-flash-lite
          DATABASE_URL: sqlite:///./evalops.db
        run: |
          python -c "
          from app.db import engine, Base, SessionLocal
          from app.runner import run_suite
          Base.metadata.create_all(bind=engine)
          db = SessionLocal()
          summary = run_suite(db)
          print(summary)
          assert summary['pass_rate'] >= 0.7, f'Pass rate too low: {summary}'
          "
